# Paper2Lab CI — the acceptance pipeline (issue #14):
#   frontend   : typecheck + full vitest (science kernels incl. wasm MuJoCo
#                run in Node) + production build
#   backend    : FastAPI protocol + agent orchestration + engine bridge tests
#                (Node engine child executes REAL kernels — no skips allowed:
#                a missing dependency is a failure, not a skip)
#   integration: product-path evidence scripts (headless real-browser, real
#                mouse) against a single-origin uvicorn serving the built SPA
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 科学内核 (Node) + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm (pinned by lockfile)
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm exec tsc -b
      - name: vitest — all science kernels (formula/kakeya/ode/geometry/mujoco/challenges)
        run: pnpm test
      - name: production build
        run: pnpm build

  backend:
    name: 后端协议 + Agent 编排 + 引擎桥
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: "pnpm (engine bridge needs node_modules with tsx + wasm kernels)"
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: python deps (full — docling/agentscope included; missing dep = fail, never skip)
        run: |
          pip install -r server/requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: pytest — API/agent/engine/restart-recovery suites
        env:
          PAPER2LAB_DATA_DIR: /tmp/p2l-ci-data
        run: python -m pytest server/tests -q -k "not real_docling"
      - name: engine smoke — real kernels over the stdio bridge (formula + physics + challenge)
        run: |
          # NOTE: PlayPlans register idempotently BY planId — first registration
          # wins (#32), so each skill must carry its OWN distinct planId.
          printf '%s\n' \
            '{"id":1,"op":"execute","skill":"formula.evaluate","input":{"expression":["Sin","x"],"bindings":{"x":1}},"planId":"ci-f","plan":{"planId":"ci-f","skill":"formula.evaluate","goal":"ci smoke","metrics":[],"nonClaims":[]}"}' \
            '{"id":2,"op":"execute","skill":"mujoco.simulate","input":{"scene":"simple.xml","steps":50,"sampleEvery":25},"planId":"ci-m","plan":{"planId":"ci-m","skill":"mujoco.simulate","goal":"ci smoke","metrics":[],"nonClaims":[]}"}' \
            '{"id":3,"op":"execute","skill":"challenge.attempt","input":{"challenge":"pendulum","changes":{"length":0.994}},"planId":"ci-c","plan":{"planId":"ci-c","skill":"challenge.attempt","goal":"ci smoke","metrics":[],"nonClaims":[]}"}' \
            '{"id":4,"op":"shutdown"}' \
            | node --import tsx scripts/engine_server.ts > /tmp/engine-out.jsonl
          grep -q '"status":"ok"' /tmp/engine-out.jsonl
          test "$(grep -c '"status":"ok"' /tmp/engine-out.jsonl)" -ge 3
          ! grep -q '"status":"error"' /tmp/engine-out.jsonl

  integration:
    name: 产品路径（无头真实浏览器）
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: python deps
        run: pip install -r server/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: build the SPA
        run: pnpm build
      - name: install chrome (playwright-core drives the system chrome)
        run: |
          npx playwright-core install --with-deps chrome || sudo apt-get install -y chromium-browser || true
      - name: boot single-origin backend (uvicorn serves dist/)
        run: |
          nohup python -m uvicorn server.main:app --host 127.0.0.1 --port 8787 \
            > /tmp/uvicorn-ci.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -m 3 http://127.0.0.1:8787/api/health && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8787/api/ready | grep -q '"ready": *true\|"ready":true'
      - name: challenges — real-mouse three levels
        run: node scripts/product-challenges-test.mjs
      - name: formula desk — multi-formula + multi-page
        run: node scripts/product-formula-test.mjs
      - name: desk upgrade — frames/actions/3D (own origin on :8798)
        run: |
          nohup python -m uvicorn server.main:app --host 127.0.0.1 --port 8798 \
            > /tmp/uvicorn-8798.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -m 3 http://127.0.0.1:8798/api/health && break
            sleep 3
          done
          node scripts/product-lab-test.mjs
