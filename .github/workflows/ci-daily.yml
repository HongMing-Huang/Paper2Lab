# Daily FULL acceptance (vs. the per-PR quick set): runs the entire pytest
# suite INCLUDING the real_docling tests that per-PR CI excludes with
# `-k "not real_docling"`. That exclusion is exactly how the PR #38
# persist_doc deletion survived five days with a green CI — the only test
# guarding it lived outside the quick set. This job is the backstop: real
# parses of the real papers, once a day, failures visible on the repo.
name: daily-full
on:
  schedule:
    - cron: "30 19 * * *" # 03:30 Beijing, after the day's merges settle
  workflow_dispatch: {}

jobs:
  full-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # J1.CI: the daily FULL run gets the same real DB/queue services as the
    # per-PR backend job, and REQUIRES them — a silent skip-wave here is the
    # exact failure mode (PR #38) this backstop exists to catch
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper2lab_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # cred-free URL: the password travels via PGPASSWORD (libpq), never
      # inside a URL that other processes/stack traces could log
      PAPER2LAB_TEST_DATABASE: postgresql://postgres@localhost:5432/paper2lab_ci_test
      PGPASSWORD: postgres
      PAPER2LAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PAPER2LAB_TEST_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "pnpm (the engine bridge + once-runner import from node_modules —
          pytest's engine tests fail with ERR_MODULE_NOT_FOUND without it)"
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: python deps
        run: pip install -r server/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: pre-warm docling models (real parses download them otherwise)
        run: python scripts/download_docling_models.py
      # build BEFORE pytest: test_static_traversal needs dist/ — with pytest
      # first it silently skipped in every CI run since the file landed
      - name: vitest + typecheck + build
        run: |
          npx vitest run
          npx tsc --noEmit
          npx vite build
      - name: full pytest (including real_docling)
        env:
          PAPER2LAB_DATA_DIR: /tmp/p2l-ci-daily-data
        run: python -m pytest server/tests -q
