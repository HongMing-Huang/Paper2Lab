[pytest]
asyncio_mode = auto
markers =
    real_pdf_trace: one real PDF through the real docling parser (slow; excluded from quick sets like real_docling)
    pg: needs a reachable PostgreSQL test database (see server/tests/testtargets.py; REQUIRED, not skipped, under PAPER2LAB_TEST_REQUIRE_SERVICES=1)
    redis: needs a reachable Redis test target (see server/tests/testtargets.py; REQUIRED, not skipped, under PAPER2LAB_TEST_REQUIRE_SERVICES=1)
